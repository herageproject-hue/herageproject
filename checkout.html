<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout — HERAGE PROJECT</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Roboto Condensed", sans-serif;
}

body{
    margin:0;
    background:#fff;
    color:#1d2736;
}

/* HEADER */

.checkout-header{
    height:82px;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.checkout-back{
    position:absolute;
    left:20px;
    font-size:32px;
    color:#1d2736;
    text-decoration:none;
}

.checkout-logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:-3px;
}

/* CONTENT */

.checkout-container{
    max-width:760px;
    margin:auto;
    padding:45px 24px 80px;
}

.section-title{
    font-size:40px;
    font-weight:800;
    margin-bottom:28px;
}

</style>
</head>

<body>

<header class="checkout-header">

    <a href="index.html" class="checkout-back">
        ←
    </a>

    <div class="checkout-logo">
        HERAGE
    </div>

</header>


<main class="checkout-container">

    <h1 class="section-title">
        Address Details
    </h1>

</main>

</body>
</html>
