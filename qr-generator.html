<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HERAGE PROJECT — QR Generator</title>

<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:10;

  padding:18px 22px;

  background:#111;
  border-bottom:1px solid #333;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
}

.print-button{
  border:none;
  padding:12px 20px;

  background:#fff;
  color:#111;

  border-radius:8px;

  font-size:13px;
  font-weight:800;

  cursor:pointer;
}

.print-button:hover{
  opacity:.85;
}

/* =========================
   TITLE
========================= */

.info{
  max-width:1200px;
  margin:28px auto 0;
  padding:0 20px;
}

.info h1{
  margin:0 0 8px;

  font-size:28px;
  font-weight:800;
  letter-spacing:1px;
}

.info p{
  margin:0;
  color:#999;
  font-size:14px;
}

/* =========================
   QR GRID
========================= */

.qr-grid{
  max-width:1200px;

  margin:28px auto;

  padding:0 20px;

  display:grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:18px;
}

/* =========================
   QR CARD
========================= */

.qr-card{

  background:#fff;

  color:#111;

  border-radius:12px;

  padding:20px;

  min-height:315px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;
}

.qr-card-title{

  margin:0 0 13px;

  font-size:15px;

  font-weight:800;

  letter-spacing:.5px;
}

/* QR */

.qr{

  width:190px;
  height:190px;

  display:flex;

  align-items:center;
  justify-content:center;
}

.qr img,
.qr canvas{

  width:190px !important;
  height:190px !important;

  display:block;
}

/* CODE */

.code{

  margin-top:13px;

  font-size:13px;

  font-weight:800;

  letter-spacing:1px;
}

/* PRODUCT */

.product{

  margin-top:5px;

  font-size:11px;

  color:#555;

  line-height:1.3;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .qr-grid{

    grid-template-columns:
      repeat(2, 1fr);

  }

}

@media(max-width:520px){

  .qr-grid{

    grid-template-columns:1fr;

  }

  .topbar{

    position:relative;

  }

}

/* =========================
   PRINT A4
========================= */

@media print{

  @page{
    size:A4;
    margin:7mm;
  }

  body{
    background:#fff;
  }

  .topbar,
  .info{
    display:none;
  }

  .qr-grid{
    max-width:none;
    margin:0;
    padding:0;

    display:grid;

    grid-template-columns:
      repeat(3, 1fr);

    grid-template-rows:
      repeat(8, 33mm);

    gap:2.5mm;
  }

  .qr-card{
    border:1px solid #ddd;

    border-radius:0;

    min-height:0;

    height:33mm;

    padding:2mm;

    break-inside:avoid;
    page-break-inside:avoid;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;
  }

  .qr-brand{
    font-size:7px;
    letter-spacing:.6px;

    margin-bottom:1mm;
  }

  .qr{
    width:22mm;
    height:22mm;
  }

  .qr img,
  .qr canvas{
    width:22mm !important;
    height:22mm !important;
  }

  .code{
    font-size:6.2px;

    letter-spacing:.25px;

    margin-top:1mm;
  }

  .product{
    font-size:5.5px;

    line-height:1.1;

    margin-top:.6mm;

    max-width:35mm;
  }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">
    HERAGE PROJECT
  </div>

  <button
    class="print-button"
    onclick="window.print()">

    PRINT ALL QR

  </button>

</header>


<!-- =========================
     TITLE
========================= -->

<section class="info">

  <h1>
    PRODUCT QR CODES
  </h1>

  <p>
    24 unique verification QR codes · HERAGE PROJECT
  </p>

</section>


<!-- =========================
     QR CONTAINER
========================= -->

<main
  class="qr-grid"
  id="qrGrid">

</main>


<script>

/* ==========================================
   BASE VERIFICATION URL
========================================== */

const BASE_URL =
"https://herageproject.my.id/verify.html?code=";


/* ==========================================
   PRODUCT DATA
========================================== */

const products = [

  {
    name:
      "LONGSLEEVE TEE - LIFE HURTS",

    prefix:
      "HG-LIFEHURTS-",

    quantity:
      12
  },

  {
    name:
      "JORTS SWEATPANTS - HERAGE",

    prefix:
      "HG-JORTS-",

    quantity:
      12
  }

];


/* ==========================================
   QR GRID
========================================== */

const qrGrid =
document.getElementById("qrGrid");


/* ==========================================
   CREATE QR CARD
========================================== */

function createQRCard(product, number){

  /* UNIQUE CODE */

  const code =
    product.prefix +
    String(number).padStart(5, "0");


  /* QR DESTINATION */

  const verificationURL =
    BASE_URL +
    encodeURIComponent(code);


  /* CARD */

  const card =
    document.createElement("div");

  card.className =
    "qr-card";


  /* TITLE */

  const title =
    document.createElement("div");

  title.className =
    "qr-card-title";

  title.textContent =
    "HERAGE PROJECT";


  /* QR CONTAINER */

  const qr =
    document.createElement("div");

  qr.className =
    "qr";


  /* CODE */

  const codeElement =
    document.createElement("div");

  codeElement.className =
    "code";

  codeElement.textContent =
    code;


  /* PRODUCT */

  const productElement =
    document.createElement("div");

  productElement.className =
    "product";

  productElement.textContent =
    product.name;


  /* ADD TO CARD */

  card.appendChild(title);

  card.appendChild(qr);

  card.appendChild(codeElement);

  card.appendChild(productElement);


  /* ADD CARD TO PAGE */

  qrGrid.appendChild(card);


  /* GENERATE QR */

  new QRCode(qr, {

    text:
      verificationURL,

    width:
      190,

    height:
      190,

    correctLevel:
      QRCode.CorrectLevel.H

  });

}


/* ==========================================
   GENERATE ALL 24 QR
========================================== */

products.forEach(product => {

  for(
    let i = 1;
    i <= product.quantity;
    i++
  ){

    createQRCard(
      product,
      i
    );

  }

});

</script>

</body>
</html>
