<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HERAGE PROJECT — Verify</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Roboto Condensed",Arial,sans-serif;
  background:#000;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}

.verify-wrap{
  width:100%;
  max-width:430px;
  text-align:center;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

.subtitle{
  font-size:13px;
  letter-spacing:2px;
  opacity:.6;
  margin-bottom:38px;
  text-transform:uppercase;
}

.card{
  background:#fff;
  color:#111;
  border-radius:20px;
  padding:30px 24px;
  box-shadow:0 20px 60px rgba(255,255,255,.08);
}

.icon{
  width:68px;
  height:68px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  font-size:32px;
  font-weight:900;
}

.icon.success{
  background:#111;
  color:#fff;
}

.icon.error{
  background:#eee;
  color:#111;
}

.status{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin-bottom:10px;
}

.message{
  font-size:14px;
  line-height:1.5;
  color:#666;
  margin-bottom:25px;
}

.product{
  border-top:1px solid #e5e5e5;
  padding-top:20px;
  text-align:left;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:8px 0;
  font-size:14px;
}

.label{
  color:#888;
}

.value{
  font-weight:700;
  text-align:right;
}

.code{
  font-family:monospace;
  font-size:13px;
  letter-spacing:.5px;
}

.footer{
  margin-top:28px;
  font-size:11px;
  letter-spacing:1.5px;
  opacity:.45;
  text-transform:uppercase;
}
</style>
</head>

<body>

<div class="verify-wrap">

  <div class="logo">HERAGE PROJECT</div>

  <div class="subtitle">
    Product Authentication
  </div>

  <div class="card" id="result">

    <div class="icon" id="icon">...</div>

    <div class="status" id="status">
      VERIFYING
    </div>

    <div class="message" id="message">
      Checking product authenticity...
    </div>

    <div class="product" id="product" style="display:none;">

      <div class="row">
        <span class="label">Product</span>
        <span class="value" id="productName"></span>
      </div>

      <div class="row">
        <span class="label">Price</span>
        <span class="value" id="price"></span>
      </div>

      <div class="row">
        <span class="label">Status</span>
        <span class="value" id="productStatus"></span>
      </div>

      <div class="row">
        <span class="label">Verification Code</span>
        <span class="value code" id="productCode"></span>
      </div>

    </div>

  </div>

  <div class="footer">
    HERAGE PROJECT · OFFICIAL AUTHENTICATION
  </div>

</div>

<script>

const supabaseUrl =
'https://bxsrbfaecrmuaziakyvi.supabase.co';

const supabaseKey =
'sb_publishable_K9COA9-im9N0B5dIj37HPQ_7pqqZ42z';

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);


// ================================
// GET CODE FROM URL
// ================================

const params = new URLSearchParams(
  window.location.search
);

const code = params.get('code');


// ================================
// ELEMENTS
// ================================

const icon =
document.getElementById('icon');

const status =
document.getElementById('status');

const message =
document.getElementById('message');

const product =
document.getElementById('product');

const productName =
document.getElementById('productName');

const price =
document.getElementById('price');

const productStatus =
document.getElementById('productStatus');

const productCode =
document.getElementById('productCode');


// ================================
// FORMAT PRICE
// ================================

function formatRupiah(value){

  return new Intl.NumberFormat(
    'id-ID',
    {
      style:'currency',
      currency:'IDR',
      maximumFractionDigits:0
    }
  ).format(value);

}


// ================================
// INVALID URL
// ================================

if(!code){

  icon.className = 'icon error';
  icon.textContent = '×';

  status.textContent =
    'INVALID CODE';

  message.textContent =
    'No product verification code was provided.';

}


// ================================
// VERIFY PRODUCT
// ================================

else{

  verifyProduct();

}


async function verifyProduct(){

  try{

    const {
      data,
      error
    } = await supabaseClient.rpc(
      'cashier_get_product',
      {
        p_code: code
      }
    );


    if(error){

      console.error(error);

      showError(
        'VERIFICATION ERROR',
        'Unable to verify this product at the moment.'
      );

      return;
    }


    // Product not found

    if(!data || data.length === 0){

      showError(
        'NOT AUTHENTIC',
        'This verification code was not found in the official HERAGE PROJECT database.'
      );

      return;
    }


    const item = data[0];


    // ================================
    // PRODUCT FOUND
    // ================================

    icon.className =
      'icon success';

    icon.textContent =
      '✓';

    status.textContent =
      'AUTHENTIC PRODUCT';

    message.textContent =
      'This product is registered in the official HERAGE PROJECT database.';


    product.style.display =
      'block';


    productName.textContent =
      item.product_name || '-';


    price.textContent =
      item.price != null
      ? formatRupiah(item.price)
      : '-';


    productStatus.textContent =
      item.status || '-';


    productCode.textContent =
      item.product_code || code;

  }

  catch(err){

    console.error(err);

    showError(
      'VERIFICATION ERROR',
      'Something went wrong while checking this product.'
    );

  }

}


// ================================
// ERROR DISPLAY
// ================================

function showError(title,text){

  icon.className =
    'icon error';

  icon.textContent =
    '×';

  status.textContent =
    title;

  message.textContent =
    text;

  product.style.display =
    'none';

}

</script>

</body>
</html>
